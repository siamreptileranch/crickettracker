<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cricket Breeding Tracker | ပုရစ်မွေးမြူရေး</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1877f2; --blue-dark:#145dbf; --blue-light:#e7f0fe;
  --bg:#f0f2f5; --card:#ffffff; --text:#050505; --text2:#65676b;
  --border:#dddfe2; --green:#42b72a; --green-bg:#e8f7e4;
  --red:#fa383e; --red-bg:#feeaea; --orange:#f7b928; --orange-bg:#fff6e0;
  --purple:#7c5cff; --purple-bg:#f0ecff; --gray-bg:#f5f6f7;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.06);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:'Inter','Noto Sans Myanmar',sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-tap-highlight-color:transparent;
  padding-bottom:76px;
}
.my{font-family:'Noto Sans Myanmar','Inter',sans-serif;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  background:var(--blue); color:#fff;
  padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  box-shadow:var(--shadow);
}
.topbar-title{display:flex; flex-direction:column; line-height:1.25;}
.topbar-title .en{font-weight:800; font-size:17px;}
.topbar-title .my{font-size:12px; opacity:.9;}
.sync-pill{
  display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.18);
  padding:5px 10px; border-radius:20px; font-size:11px; font-weight:600;
}
.sync-dot{width:8px; height:8px; border-radius:50%; background:#8ef58e;}
.sync-dot.syncing{background:#ffe17a; animation:pulse 1s infinite;}
.sync-dot.offline{background:#ff9b9b;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- Tabs ---------- */
.tabs{
  position:sticky; top:52px; z-index:49;
  display:flex; background:#fff; border-bottom:1px solid var(--border);
  overflow-x:auto;
}
.tab-btn{
  flex:1; min-width:80px; padding:11px 6px; text-align:center; background:none; border:none;
  font-size:12.5px; font-weight:600; color:var(--text2); border-bottom:3px solid transparent;
  display:flex; flex-direction:column; align-items:center; gap:2px;
}
.tab-btn .my{font-size:10.5px; font-weight:500;}
.tab-btn.active{color:var(--blue); border-bottom-color:var(--blue);}
.tab-btn svg{width:20px; height:20px;}

main{max-width:900px; margin:0 auto; padding:12px;}
.tabpanel{display:none;}
.tabpanel.active{display:block; animation:fade .15s ease;}
@keyframes fade{from{opacity:0} to{opacity:1}}

/* ---------- Cards / generic ---------- */
.card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px;}
.section-title{font-size:15px; font-weight:800; margin-bottom:10px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
.section-title .my{font-weight:600; font-size:12px; color:var(--text2);}
.muted{color:var(--text2); font-size:12.5px;}

/* ---------- Stat grid ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:12px;}
@media(min-width:560px){.stat-grid{grid-template-columns:repeat(4,1fr);}}
.stat-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; text-align:center;}
.stat-card .num{font-size:24px; font-weight:800; color:var(--blue);}
.stat-card.issue .num{color:var(--red);}
.stat-card.ready .num{color:var(--green);}
.stat-card.due .num{color:var(--orange);}
.stat-card .lbl{font-size:11px; color:var(--text2); font-weight:600; margin-top:2px;}
.stat-card .lbl .my{display:block; font-size:10px;}

/* ---------- Pipeline ---------- */
.pipeline{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px;}
.pipe-stage{flex:1; min-width:84px; background:var(--gray-bg); border-radius:8px; padding:10px 6px; text-align:center;}
.pipe-stage .n{font-size:19px; font-weight:800; color:var(--blue);}
.pipe-stage .l{font-size:10px; font-weight:700; color:var(--text2); margin-top:2px;}
.pipe-stage .l .my{display:block; font-size:9px; font-weight:500;}

/* ---------- Lists ---------- */
.list-item{
  background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:12px 14px; margin-bottom:9px; cursor:pointer;
}
.li-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.li-title{font-weight:700; font-size:14.5px;}
.li-sub{font-size:12px; color:var(--text2); margin-top:2px;}
.badge{
  display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap;
}
.badge.ready{background:var(--green-bg); color:var(--green);}
.badge.issue{background:var(--red-bg); color:var(--red);}
.badge.active{background:var(--blue-light); color:var(--blue);}
.badge.new{background:var(--gray-bg); color:var(--text2);}
.badge.overdue{background:var(--red-bg); color:var(--red);}
.badge.hatch{background:var(--purple-bg); color:var(--purple);}
.li-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
.chip{background:var(--gray-bg); border-radius:6px; padding:3px 8px; font-size:11px; color:var(--text2); font-weight:600;}
.chip.warn{background:var(--orange-bg); color:#8a6100;}

/* ---------- Mini stepper (batches) ---------- */
.mini-stepper{display:flex; align-items:center; margin-top:9px;}
.mini-stepper .dot{width:9px; height:9px; border-radius:50%; background:var(--border); flex-shrink:0;}
.mini-stepper .dot.done{background:var(--green);}
.mini-stepper .dot.current{background:var(--blue); box-shadow:0 0 0 3px var(--blue-light);}
.mini-stepper .line{flex:1; height:2px; background:var(--border);}
.mini-stepper .line.done{background:var(--green);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; border-radius:8px; padding:10px 16px; font-weight:700; font-size:13.5px;
}
.btn-primary{background:var(--blue); color:#fff;}
.btn-secondary{background:var(--gray-bg); color:var(--text);}
.btn-danger{background:var(--red-bg); color:var(--red);}
.btn-block{width:100%;}
.fab{
  position:fixed; right:16px; bottom:88px; z-index:40;
  width:54px; height:54px; border-radius:50%; background:var(--blue); color:#fff;
  box-shadow:0 4px 12px rgba(24,119,242,.4); font-size:26px; border:none;
  display:flex; align-items:center; justify-content:center;
}

/* ---------- Search / filter ---------- */
.search-row{display:flex; gap:8px; margin-bottom:10px;}
.search-row input[type=text]{flex:1;}
.filter-chips{display:flex; gap:6px; overflow-x:auto; margin-bottom:10px;}
.filter-chip{
  padding:6px 12px; border-radius:20px; background:#fff; border:1px solid var(--border);
  font-size:12px; font-weight:600; white-space:nowrap; color:var(--text2);
}
.filter-chip.active{background:var(--blue); color:#fff; border-color:var(--blue);}

/* ---------- Forms ---------- */
input[type=text], input[type=number], input[type=date], select, textarea{
  width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:8px;
  font-size:14px; font-family:inherit; background:#fff; color:var(--text);
}
label{display:block; font-size:12px; font-weight:700; color:var(--text2); margin-bottom:5px; margin-top:12px;}
label .my{font-weight:500; font-size:11px;}
label:first-of-type{margin-top:0;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 10px;}
.form-grid .full{grid-column:1/-1;}
.hint{font-size:10.5px; color:var(--text2); margin-top:3px;}
.check-row{display:flex; align-items:center; gap:8px; margin-top:12px;}
.check-row input{width:auto;}
.check-row label{margin:0;}
fieldset{border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-top:14px;}
legend{font-size:12.5px; font-weight:800; color:var(--blue); padding:0 6px;}

/* ---------- Modal ---------- */
.modal-overlay{
  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100;
  display:flex; align-items:flex-end; justify-content:center;
}
@media(min-width:640px){.modal-overlay{align-items:center;}}
.modal{
  background:#fff; width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
  border-radius:16px 16px 0 0; padding:0;
}
@media(min-width:640px){.modal{border-radius:14px;}}
.modal-head{
  position:sticky; top:0; background:#fff; z-index:2; padding:14px 16px; border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
}
.modal-head h3{font-size:16px; font-weight:800;}
.modal-head .my{font-size:11.5px; color:var(--text2); font-weight:500;}
.modal-close{background:var(--gray-bg); border:none; width:30px; height:30px; border-radius:50%; font-size:16px; color:var(--text2);}
.modal-body{padding:14px 16px 20px;}
.modal-foot{padding:12px 16px 18px; display:flex; gap:8px; border-top:1px solid var(--border);}

/* ---------- Toast ---------- */
#toast{
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
  background:#1c1e21; color:#fff; padding:10px 18px; border-radius:24px; font-size:13px; font-weight:600;
  opacity:0; transition:.25s; z-index:200; pointer-events:none; white-space:nowrap;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- Reports ---------- */
.report-row{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;
}
.report-row:last-child{border-bottom:none;}
.report-row .rg{font-weight:700;}
.report-row .rd{color:var(--text2); font-size:12px;}
.empty-state{text-align:center; padding:30px 10px; color:var(--text2);}
.empty-state svg{width:44px; height:44px; opacity:.35; margin-bottom:8px;}

::-webkit-scrollbar{height:0; width:0;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">
    <span class="en">🦗 Cricket Breeding Tracker</span>
    <span class="my">ပုရစ်မွေးမြူရေး စနစ်</span>
  </div>
  <div class="sync-pill"><span class="sync-dot" id="syncDot"></span><span id="syncLabel">Synced</span></div>
</div>

<div class="tabs">
  <button class="tab-btn active" data-tab="dashboard">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
    <span>Dashboard</span><span class="my">ခြုံငုံသုံးသပ်ချက်</span>
  </button>
  <button class="tab-btn" data-tab="groups">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="3"/><path d="M2 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2"/><circle cx="17" cy="7" r="3" opacity=".5"/></svg>
    <span>Groups</span><span class="my">အုပ်စုများ</span>
  </button>
  <button class="tab-btn" data-tab="batches">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/><circle cx="20" cy="18" r="1.5" fill="currentColor"/></svg>
    <span>Batches</span><span class="my">မျိုးပွားစဉ်</span>
  </button>
  <button class="tab-btn" data-tab="reports">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9z"/><path d="M9 3v6h6M9 13h6M9 17h6"/></svg>
    <span>Reports</span><span class="my">အစီရင်ခံစာ</span>
  </button>
</div>

<main>
  <!-- ===================== DASHBOARD ===================== -->
  <section id="tab-dashboard" class="tabpanel active">
    <div class="stat-grid" id="statGrid"></div>

    <div class="card">
      <div class="section-title">Batch Pipeline <span class="my">အဆင့်အလိုက်</span></div>
      <div class="pipeline" id="pipelineRow"></div>
    </div>

    <div class="card">
      <div class="section-title">⚠️ Issues Needing Attention <span class="my">ဂရုစိုက်ရန်</span></div>
      <div id="dashIssues"></div>
    </div>

    <div class="card">
      <div class="section-title">📅 Due in Next 7 Days <span class="my">ရက် ၇ ရက်အတွင်း</span></div>
      <div id="dashDue"></div>
    </div>
  </section>

  <!-- ===================== GROUPS ===================== -->
  <section id="tab-groups" class="tabpanel">
    <div class="search-row">
      <input type="text" id="groupSearch" placeholder="Search group # ...">
    </div>
    <div class="filter-chips" id="groupFilters"></div>
    <div id="groupList"></div>
  </section>

  <!-- ===================== BATCHES ===================== -->
  <section id="tab-batches" class="tabpanel">
    <div class="search-row">
      <input type="text" id="batchSearch" placeholder="Search source / hatched group # ...">
    </div>
    <div class="filter-chips" id="batchFilters"></div>
    <div id="batchList"></div>
  </section>

  <!-- ===================== REPORTS ===================== -->
  <section id="tab-reports" class="tabpanel">
    <div class="card">
      <div class="section-title">
        Next Breeding Report <span class="my">မွေးမြူရန် နောက်ရက်စွဲ</span>
      </div>
      <p class="muted" style="margin-bottom:8px;">Sorted soonest first. Ready-to-breed groups are shown at the top.</p>
      <div id="reportBreeding"></div>
      <button class="btn btn-secondary btn-block" style="margin-top:12px;" onclick="copyReport('breeding')">📋 Copy Breeding Report</button>
    </div>

    <div class="card">
      <div class="section-title">🚩 Issues Report <span class="my">ပြဿနာများ</span></div>
      <div id="reportIssues"></div>
      <button class="btn btn-secondary btn-block" style="margin-top:12px;" onclick="copyReport('issues')">📋 Copy Issues Report</button>
    </div>
  </section>
</main>

<button class="fab" id="fabBtn">+</button>

<div id="toast"></div>
<div id="modalRoot"></div>

<script>
/* =========================================================================
   CONFIG — paste your Apps Script /exec URL below after deploying Code.gs
   ========================================================================= */
const CONFIG = {
  APPS_SCRIPT_URL: 'PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE',
  POLL_MS: 20000
};

/* =========================================================================
   DROPDOWN OPTIONS — sourced from the "groups" reference sheet
   ========================================================================= */
const OPT = {
  cricketSize: ['Egg','#000','#00','#0','#1','#2','#3','#4'],
  yesNo: ['Yes','No'],
  eggAmount: ['Little','Normal','A Lot'],
  hatchTiming: ['On Time','Late','No / Did Not Hatch'],
  spoonSize: ['#0','#1','#2','#3','#4','#5','#6','#7'],
  spoonAmount: ['1','2','3','4'],
  waterType: ['Foam #1','Foam #2','Foam #3','CD Type'],
  level3: ['Below Normal','Normal','Above Normal'],
  growth: ['Slow','Normal','Fast'],
  density: ['Little','Average','A Lot']
};
const MY = { // Burmese labels for dropdown values (best-effort translation)
  'Egg':'ဥ','#000':'#000','#00':'#00','#0':'#0','#1':'#1','#2':'#2','#3':'#3','#4':'#4',
  'Yes':'ဟုတ်ကဲ့','No':'မဟုတ်ပါ',
  'Little':'နည်း','Normal':'ပုံမှန်','A Lot':'များ',
  'On Time':'အချိန်မီ','Late':'နောက်ကျ','No / Did Not Hatch':'မထွက်ပါ',
  'Below Normal':'ပုံမှန်ထက်နည်း','Above Normal':'ပုံမှန်ထက်များ',
  'Slow':'နှေး','Fast':'မြန်','Average':'ပျမ်းမျှ',
  'Foam #1':'အမြှုပ် #1','Foam #2':'အမြှုပ် #2','Foam #3':'အမြှုပ် #3','CD Type':'စီဒီ'
};
function opt(v){ return MY[v] ? `${v} (${MY[v]})` : v; }

// Expected day-offsets between pipeline stages — derived from the sample schedule.
// Adjust here if actual timing differs.
const OFFSETS = { breed_eggs:1, eggs_hot:4, cold_hot:4, hot_tub:7, tub_hatch:3 };
const BREED_CYCLE_MIN = 42, BREED_CYCLE_MAX = 45; // 6 – 6.4 weeks

/* =========================================================================
   STATE
   ========================================================================= */
let groups = [];
let batches = [];
let lastModified = 0;
let activeTab = 'dashboard';
let groupFilter = 'all', batchFilter = 'all';

const LS = { g:'crx_groups_v1', b:'crx_batches_v1', lm:'crx_lastmod_v1' };

/* =========================================================================
   HELPERS
   ========================================================================= */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return toLocalISO(new Date()); }
function toLocalISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function parseDate(str){ if(!str) return null; const d=new Date(str+'T00:00:00'); return isNaN(d)?null:d; }
function addDays(date, n){ if(!date) return null; const d=new Date(date); d.setDate(d.getDate()+n); return d; }
function fmtDate(d){
  if(!d) return '—';
  if(typeof d === 'string') d = parseDate(d);
  if(!d) return '—';
  const dd=String(d.getDate()).padStart(2,'0'), mm=String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}
function daysBetween(a,b){ if(!a||!b) return null; return Math.round((b-a)/86400000); }
function esc(s){ return (s===undefined||s===null)?'':String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(window._toastTimer); window._toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}
function selectHtml(id, options, value, translated){
  let h = `<select id="${id}">`;
  h += `<option value="">-- select --</option>`;
  options.forEach(o=>{
    const label = translated ? opt(o) : o;
    h += `<option value="${esc(o)}" ${o===value?'selected':''}>${esc(label)}</option>`;
  });
  h += `</select>`;
  return h;
}

/* =========================================================================
   LOCAL STORAGE
   ========================================================================= */
function loadLocal(){
  try{ groups = JSON.parse(localStorage.getItem(LS.g) || '[]'); }catch(e){ groups=[]; }
  try{ batches = JSON.parse(localStorage.getItem(LS.b) || '[]'); }catch(e){ batches=[]; }
  lastModified = Number(localStorage.getItem(LS.lm) || 0);
}
function saveLocal(){
  localStorage.setItem(LS.g, JSON.stringify(groups));
  localStorage.setItem(LS.b, JSON.stringify(batches));
  localStorage.setItem(LS.lm, String(lastModified));
}

/* =========================================================================
   GROUP LOGIC
   ========================================================================= */
function getGroupIssues(g){
  const issues=[];
  if(g.eatingCondition==='Below Normal') issues.push({en:'Eating below normal', my:'အစားစားနှုန်း ပုံမှန်ထက်နည်း'});
  if(g.drinkingAmount==='Below Normal') issues.push({en:'Drinking below normal', my:'ရေသောက်နှုန်း ပုံမှန်ထက်နည်း'});
  if(g.growthRate==='Slow') issues.push({en:'Growth rate slow', my:'ကြီးထွားမှု နှေးကွေး'});
  if(g.hatchTiming==='Late') issues.push({en:'Eggs hatched late', my:'ဥ နောက်ကျထွက်'});
  if(g.hatchTiming==='No / Did Not Hatch') issues.push({en:'Eggs did not hatch', my:'ဥ မထွက်ပါ'});
  if(g.density==='A Lot') issues.push({en:'Tub overcrowded (high density)', my:'ပုံးထဲ သိပ်သည်းလွန်း'});
  return issues;
}
function getGroupStatus(g){
  if(g.readyToBreed==='Yes') return {label:'Ready to Breed', my:'မွေးမြူရန်အသင့်', cls:'ready'};
  if(getGroupIssues(g).length) return {label:'Needs Attention', my:'ဂရုစိုက်ရန်', cls:'issue'};
  if(g.breedingDate) return {label:'Growing', my:'ကြီးထွားနေဆဲ', cls:'active'};
  return {label:'New', my:'အသစ်', cls:'new'};
}
function getNextBreedWindow(g){
  if(g.readyToBreed==='Yes') return {status:'ready-now'};
  if(!g.breedingDate) return {status:'no-date'};
  const start = parseDate(g.breedingDate);
  if(!start) return {status:'no-date'};
  return {status:'window', early: addDays(start, BREED_CYCLE_MIN), late: addDays(start, BREED_CYCLE_MAX)};
}

/* =========================================================================
   BATCH LOGIC
   ========================================================================= */
const STAGE_ORDER = ['breed','eggs','cold','hot','tub','hatch'];
const STAGE_LABEL = {
  breed:{en:'Breeding', my:'မျိုးပွားနေ'}, eggs:{en:'Eggs Collected', my:'ဥစုဆောင်းပြီး'},
  cold:{en:'Cold Room', my:'အအေးခန်း'}, hot:{en:'Hot Room', my:'ရေနွေးခန်း'},
  tub:{en:'In Tub', my:'ပုံးထဲ'}, hatch:{en:'Hatched', my:'ထွက်ပြီး'}, new:{en:'Not Started', my:'မစသေး'}
};
function getBatchStage(b){
  if(b.hatchedGroup) return 'hatch';
  if(b.tubDate) return 'tub';
  if(b.hotRoomDate) return 'hot';
  if(b.coldRoomDate) return 'cold';
  if(b.eggCollectedDate) return 'eggs';
  if(b.breedDate) return 'breed';
  return 'new';
}
function getBatchNextExpected(b){
  const stage = getBatchStage(b);
  if(stage==='hatch' || stage==='new') return null;
  if(stage==='tub') return addDays(parseDate(b.tubDate), OFFSETS.tub_hatch);
  if(stage==='hot') return addDays(parseDate(b.hotRoomDate), OFFSETS.hot_tub);
  if(stage==='cold'){
    const skipped = b.coldRoomDate === 'SKIP';
    const base = skipped ? parseDate(b.eggCollectedDate) : parseDate(b.coldRoomDate);
    return addDays(base, OFFSETS.cold_hot);
  }
  if(stage==='eggs') return addDays(parseDate(b.eggCollectedDate), OFFSETS.eggs_hot);
  if(stage==='breed') return addDays(parseDate(b.breedDate), OFFSETS.breed_eggs);
  return null;
}
function isBatchOverdue(b){
  const stage = getBatchStage(b);
  if(stage==='hatch' || stage==='new') return false;
  const exp = getBatchNextExpected(b);
  if(!exp) return false;
  return parseDate(todayStr()) > exp;
}

/* =========================================================================
   SYNC — GET-only against Google Apps Script (avoids CORS preflight)
   ========================================================================= */
async function syncFromServer(silent){
  if(!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0){
    setSyncStatus('offline','Not connected'); return;
  }
  setSyncStatus('syncing','Syncing...');
  try{
    const res = await fetch(`${CONFIG.APPS_SCRIPT_URL}?action=list&t=${Date.now()}`);
    const data = await res.json();
    if(Array.isArray(data.groups) && data.groups.length) mergeById(groups, data.groups, list=>groups=list);
    if(Array.isArray(data.batches) && data.batches.length) mergeById(batches, data.batches, list=>batches=list);
    if(data.lastModified) lastModified = data.lastModified;
    saveLocal();
    setSyncStatus('online','Synced');
    renderAll();
  }catch(e){
    setSyncStatus('offline','Offline');
    if(!silent) toast('Could not reach server — working offline');
  }
}
function mergeById(localArr, serverArr, setFn){
  const map = new Map();
  localArr.forEach(item=>map.set(item.id, item));
  serverArr.forEach(item=>{
    const existing = map.get(item.id);
    if(!existing || (item.updatedAt||0) >= (existing.updatedAt||0)) map.set(item.id, item);
  });
  setFn(Array.from(map.values()));
}
function setSyncStatus(state, label){
  const dot=document.getElementById('syncDot'), lbl=document.getElementById('syncLabel');
  dot.className = 'sync-dot' + (state==='syncing'?' syncing':state==='offline'?' offline':'');
  lbl.textContent = label;
}
async function pushToServer(action, payload){
  if(!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.indexOf('PASTE_YOUR') === 0) return false;
  try{
    setSyncStatus('syncing','Saving...');
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=${action}&payload=${encodeURIComponent(JSON.stringify(payload))}`;
    await fetch(url);
    setSyncStatus('online','Synced');
    return true;
  }catch(e){
    setSyncStatus('offline','Offline (saved locally)');
    return false;
  }
}

/* =========================================================================
   CRUD
   ========================================================================= */
function upsertGroup(g){
  g.updatedAt = Date.now();
  const idx = groups.findIndex(x=>x.id===g.id);
  if(idx>=0) groups[idx]=g; else groups.push(g);
  saveLocal();
  pushToServer('saveGroup', g);
  renderAll();
}
function deleteGroupById(id){
  groups = groups.filter(g=>g.id!==id);
  saveLocal();
  pushToServer('deleteGroup', {id});
  renderAll();
}
function upsertBatch(b){
  b.updatedAt = Date.now();
  const idx = batches.findIndex(x=>x.id===b.id);
  if(idx>=0) batches[idx]=b; else batches.push(b);
  saveLocal();
  pushToServer('saveBatch', b);
  // auto-create a group profile when a batch is hatched into a new group #
  if(b.hatchedGroup && !groups.find(g=>g.groupNumber===b.hatchedGroup)){
    upsertGroup({ id: uid('grp'), groupNumber: b.hatchedGroup, breedingDate:'', readyToBreed:'', notes:`Auto-created from batch (source group ${b.sourceGroup||'—'})` });
  }
  renderAll();
}
function deleteBatchById(id){
  batches = batches.filter(b=>b.id!==id);
  saveLocal();
  pushToServer('deleteBatch', {id});
  renderAll();
}

/* =========================================================================
   RENDER — DASHBOARD
   ========================================================================= */
function renderDashboard(){
  const readyCount = groups.filter(g=>g.readyToBreed==='Yes').length;
  const issueGroups = groups.filter(g=>getGroupIssues(g).length>0);
  const overdueBatches = batches.filter(isBatchOverdue);
  const dueSoon = getDueSoonList();

  document.getElementById('statGrid').innerHTML = `
    <div class="stat-card"><div class="num">${groups.length}</div><div class="lbl">Total Groups<span class="my">အုပ်စုစုစုပေါင်း</span></div></div>
    <div class="stat-card ready"><div class="num">${readyCount}</div><div class="lbl">Ready to Breed<span class="my">မွေးမြူရန်အသင့်</span></div></div>
    <div class="stat-card issue"><div class="num">${issueGroups.length + overdueBatches.length}</div><div class="lbl">Issues Flagged<span class="my">ပြဿနာများ</span></div></div>
    <div class="stat-card due"><div class="num">${dueSoon.length}</div><div class="lbl">Due This Week<span class="my">ဒီအပတ်ကျရောက်</span></div></div>
  `;

  const counts = {};
  STAGE_ORDER.forEach(s=>counts[s]=0);
  batches.forEach(b=>counts[getBatchStage(b)] = (counts[getBatchStage(b)]||0)+1);
  document.getElementById('pipelineRow').innerHTML = STAGE_ORDER.map(s=>`
    <div class="pipe-stage"><div class="n">${counts[s]||0}</div><div class="l">${STAGE_LABEL[s].en}<span class="my">${STAGE_LABEL[s].my}</span></div></div>
  `).join('');

  const issuesHtml = [];
  issueGroups.forEach(g=>{
    getGroupIssues(g).forEach(i=>issuesHtml.push(`<div class="report-row"><span class="rg">Group ${esc(g.groupNumber)}</span><span class="rd">${esc(i.en)}</span></div>`));
  });
  overdueBatches.forEach(b=>{
    const stage = STAGE_LABEL[getBatchStage(b)].en;
    issuesHtml.push(`<div class="report-row"><span class="rg">Batch (src: ${esc(b.sourceGroup||'—')})</span><span class="rd">Overdue at "${stage}" stage</span></div>`);
  });
  document.getElementById('dashIssues').innerHTML = issuesHtml.length ? issuesHtml.join('') :
    `<div class="empty-state">✅ No issues flagged right now</div>`;

  document.getElementById('dashDue').innerHTML = dueSoon.length ? dueSoon.map(d=>`
    <div class="report-row"><span class="rg">${esc(d.title)}</span><span class="rd">${fmtDate(d.date)}</span></div>
  `).join('') : `<div class="empty-state">Nothing due in the next 7 days</div>`;
}
function getDueSoonList(){
  const today = parseDate(todayStr());
  const list = [];
  batches.forEach(b=>{
    const exp = getBatchNextExpected(b);
    if(exp){
      const d = daysBetween(today, exp);
      if(d!==null && d>=0 && d<=7){
        const stage = getBatchStage(b);
        const nextStage = STAGE_ORDER[STAGE_ORDER.indexOf(stage)+1];
        list.push({ title:`Batch (src ${b.sourceGroup||'—'}) → ${STAGE_LABEL[nextStage]?.en||'Next stage'}`, date: exp });
      }
    }
  });
  groups.forEach(g=>{
    const w = getNextBreedWindow(g);
    if(w.status==='window'){
      const d = daysBetween(today, w.early);
      if(d!==null && d>=0 && d<=7) list.push({ title:`Group ${g.groupNumber} — breeding window opens`, date: w.early });
    }
  });
  return list.sort((a,b)=>a.date-b.date);
}

/* =========================================================================
   RENDER — BATCHES
   ========================================================================= */
function renderBatchFilters(){
  const filters = [{k:'all',l:'All'},{k:'active',l:'In Progress'},{k:'overdue',l:'Overdue'},{k:'hatch',l:'Hatched'}];
  document.getElementById('batchFilters').innerHTML = filters.map(f=>
    `<button class="filter-chip ${batchFilter===f.k?'active':''}" onclick="setBatchFilter('${f.k}')">${f.l}</button>`
  ).join('');
}
function setBatchFilter(k){ batchFilter=k; renderBatches(); renderBatchFilters(); }
function renderBatches(){
  const q = (document.getElementById('batchSearch').value||'').toLowerCase();
  let list = batches.filter(b=>
    String(b.sourceGroup||'').toLowerCase().includes(q) || String(b.hatchedGroup||'').toLowerCase().includes(q)
  );
  if(batchFilter==='overdue') list = list.filter(isBatchOverdue);
  else if(batchFilter==='hatch') list = list.filter(b=>getBatchStage(b)==='hatch');
  else if(batchFilter==='active') list = list.filter(b=>{const s=getBatchStage(b); return s!=='hatch' && s!=='new';});

  list = list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));

  document.getElementById('batchList').innerHTML = list.length ? list.map(b=>{
    const stage = getBatchStage(b);
    const overdue = isBatchOverdue(b);
    const stageIdx = STAGE_ORDER.indexOf(stage);
    const dots = STAGE_ORDER.map((s,i)=>{
      const cls = i<stageIdx?'done':(i===stageIdx?'current':'');
      const line = i<STAGE_ORDER.length-1 ? `<div class="line ${i<stageIdx?'done':''}"></div>` : '';
      return `<div class="dot ${cls}"></div>${line}`;
    }).join('');
    return `
      <div class="list-item" onclick="openBatchModal('${b.id}')">
        <div class="li-top">
          <div>
            <div class="li-title">Source Group ${esc(b.sourceGroup||'—')} ${b.hatchedGroup?`→ Group ${esc(b.hatchedGroup)}`:''}</div>
            <div class="li-sub">Breed date: ${fmtDate(b.breedDate)}</div>
          </div>
          <span class="badge ${overdue?'overdue':stage==='hatch'?'hatch':'active'}">${overdue?'Overdue':STAGE_LABEL[stage].en}</span>
        </div>
        <div class="mini-stepper">${dots}</div>
        <div class="li-meta">
          ${b.redTrays?`<span class="chip">🔴 ${esc(b.redTrays)} trays (70g)</span>`:''}
          ${b.blackTrays?`<span class="chip">⚫ ${esc(b.blackTrays)} trays (220g)</span>`:''}
        </div>
      </div>`;
  }).join('') : `<div class="empty-state">No batches yet. Tap + to start one.</div>`;
}

/* =========================================================================
   RENDER — REPORTS
   ========================================================================= */
function renderReports(){
  const rows = groups.map(g=>({g, win:getNextBreedWindow(g)}));
  rows.sort((a,b)=>{
    const order = {'ready-now':0,'window':1,'no-date':2};
    if(order[a.win.status]!==order[b.win.status]) return order[a.win.status]-order[b.win.status];
    if(a.win.status==='window') return a.win.early-b.win.early;
    return String(a.g.groupNumber).localeCompare(String(b.g.groupNumber), undefined, {numeric:true});
  });
  document.getElementById('reportBreeding').innerHTML = rows.length ? rows.map(({g,win})=>{
    const txt = win.status==='ready-now' ? '✅ Ready now' : win.status==='no-date' ? 'No breeding date set' : `${fmtDate(win.early)} – ${fmtDate(win.late)}`;
    return `<div class="report-row"><span class="rg">Group ${esc(g.groupNumber)}</span><span class="rd">${txt}</span></div>`;
  }).join('') : `<div class="empty-state">No groups yet</div>`;

  const issueLines = [];
  groups.forEach(g=>{
    getGroupIssues(g).forEach(i=>issueLines.push(`Group ${g.groupNumber}: ${i.en}`));
  });
  batches.forEach(b=>{
    if(isBatchOverdue(b)){
      const stage = STAGE_LABEL[getBatchStage(b)].en;
      issueLines.push(`Batch (source group ${b.sourceGroup||'—'}): overdue at "${stage}" stage — expected by ${fmtDate(getBatchNextExpected(b))}`);
    }
  });
  document.getElementById('reportIssues').innerHTML = issueLines.length ?
    issueLines.map(l=>`<div class="report-row"><span class="rd">${esc(l)}</span></div>`).join('') :
    `<div class="empty-state">✅ No issues right now</div>`;
}
function copyReport(kind){
  let text = '';
  if(kind==='breeding'){
    text = `CRICKET BREEDING SCHEDULE REPORT — ${fmtDate(todayStr())}\n\n`;
    groups.forEach(g=>{
      const win = getNextBreedWindow(g);
      const txt = win.status==='ready-now' ? 'Ready now' : win.status==='no-date' ? 'No breeding date set' : `${fmtDate(win.early)} - ${fmtDate(win.late)}`;
      text += `Group ${g.groupNumber}: ${txt}\n`;
    });
  } else {
    text = `CRICKET ISSUES REPORT — ${fmtDate(todayStr())}\n\n`;
    let any=false;
    groups.forEach(g=>{
      getGroupIssues(g).forEach(i=>{ text += `Group ${g.groupNumber}: ${i.en}\n`; any=true; });
    });
    batches.forEach(b=>{
      if(isBatchOverdue(b)){
        text += `Batch (source group ${b.sourceGroup||'—'}): overdue at "${STAGE_LABEL[getBatchStage(b)].en}" stage\n`;
        any=true;
      }
    });
    if(!any) text += 'No issues right now.\n';
  }
  navigator.clipboard.writeText(text).then(()=>toast('Report copied to clipboard')).catch(()=>toast('Could not copy — select manually'));
}

function submitGroup(id){
  const val = k=>document.getElementById(k)?.value?.trim() || '';
  const groupNumber = val('f_groupNumber');
  if(!groupNumber){ toast('Group # is required'); return; }
  const dup = groups.find(g=>g.id!==id && g.groupNumber===groupNumber);
  if(dup){ toast('A group with this number already exists'); return; }
  const g = {
    id, groupNumber,
    racksBreeding: val('f_racksBreeding'), eggWeightBreeding: val('f_eggWeightBreeding'),
    racksFeeding: val('f_racksFeeding'), eggWeightFeeding: val('f_eggWeightFeeding'),
    cricketSize: val('f_cricketSize'), breedingDate: val('f_breedingDate'), readyToBreed: val('f_readyToBreed'),
    racksUsedToBreed: val('f_racksUsedToBreed'), dateCollectedEggs: val('f_dateCollectedEggs'),
    eggAmountLaid: val('f_eggAmountLaid'), hatchTiming: val('f_hatchTiming'), dateColdRoom: val('f_dateColdRoom'),
    foodSpoonSize: val('f_foodSpoonSize'), foodSpoonAmount: val('f_foodSpoonAmount'),
    waterBottleType: val('f_waterBottleType'), waterBottleCount: val('f_waterBottleCount'),
    eatingCondition: val('f_eatingCondition'), drinkingAmount: val('f_drinkingAmount'),
    growthRate: val('f_growthRate'), density: val('f_density'), notes: val('f_notes')
  };
  upsertGroup(g);
  closeModal();
  toast('Group saved');
}
function confirmDeleteGroup(id){
  if(confirm('Delete this group? This cannot be undone.')){ deleteGroupById(id); closeModal(); toast('Group deleted'); }
}

/* =========================================================================
   MODALS — BATCH
   ========================================================================= */
function openBatchModal(id){
  const b = id ? batches.find(x=>x.id===id) : {
    id: uid('bat'), sourceGroup:'', breedDate:'', eggCollectedDate:'', coldRoomDate:'', hotRoomDate:'',
    tubDate:'', hatchedGroup:'', redTrays:'', blackTrays:''
  };
  const isNew = !id;
  const skipCold = b.coldRoomDate === 'SKIP';
  const groupOptionsHtml = groups.map(g=>`<option value="${esc(g.groupNumber)}">`).join('');
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-head">
        <div><h3>${isNew?'Start':'Edit'} Batch</h3><div class="my">မျိုးပွားစဉ် ${isNew?'စတင်ရန်':'ပြင်ရန်'}</div></div>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body">
        <datalist id="groupOptions">${groupOptionsHtml}</datalist>

        <label>Source Group # (6-week crickets used) <span class="my">အုပ်စုနံပါတ်ကို အသုံးပြုသည်</span></label>
        <input type="text" id="f_sourceGroup" list="groupOptions" value="${esc(b.sourceGroup)}" placeholder="e.g. G3">

        <label>Breed Date <span class="my">ပုရစ်မျိုးပွားမည့်ရက်</span></label>
        <input type="date" id="f_breedDate" value="${esc(b.breedDate)}">

        <label>Date Collected Eggs <span class="my">ရက်စွဲကြက်ဥစုဆောင်း</span></label>
        <input type="date" id="f_eggCollectedDate" value="${esc(b.eggCollectedDate)}">

        <div class="check-row">
          <input type="checkbox" id="f_skipCold" ${skipCold?'checked':''} onchange="toggleColdRoom()">
          <label style="margin:0">Skip Cold Room (mark "NO")</label>
        </div>
        <label id="lbl_coldRoom" style="${skipCold?'display:none':''}">Date Put Into Cold Room (20°C) <span class="my">အအေးခန်း</span></label>
        <input type="date" id="f_coldRoomDate" value="${skipCold?'':esc(b.coldRoomDate)}" style="${skipCold?'display:none':''}">

        <label>Place Into Hot Room <span class="my">ရေနွေးခန်း</span></label>
        <input type="date" id="f_hotRoomDate" value="${esc(b.hotRoomDate)}">

        <label>Place in Tub Date <span class="my">ပုံးထဲသို့ထည့်ရက်</span></label>
        <input type="date" id="f_tubDate" value="${esc(b.tubDate)}">

        <label>Hatched → Group # (date hatched) <span class="my">အုပ်စုနံပါတ်</span></label>
        <input type="text" id="f_hatchedGroup" list="groupOptions" value="${esc(b.hatchedGroup)}" placeholder="e.g. G7 (creates group if new)">

        <div class="form-grid">
          <div><label>Red Trays (70g)</label><input type="number" min="0" id="f_redTrays" value="${esc(b.redTrays)}"></div>
          <div><label>Black Trays (220g)</label><input type="number" min="0" id="f_blackTrays" value="${esc(b.blackTrays)}"></div>
        </div>
      </div>
      <div class="modal-foot">
        ${!isNew?`<button class="btn btn-danger" onclick="confirmDeleteBatch('${b.id}')">Delete</button>`:''}
        <button class="btn btn-secondary" style="flex:1" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" style="flex:1" onclick="submitBatch('${b.id}')">Save</button>
      </div>
    </div>
  </div>`;
}
function toggleColdRoom(){
  const skip = document.getElementById('f_skipCold').checked;
  document.getElementById('lbl_coldRoom').style.display = skip ? 'none' : '';
  document.getElementById('f_coldRoomDate').style.display = skip ? 'none' : '';
}
function submitBatch(id){
  const val = k=>document.getElementById(k)?.value?.trim() || '';
  const skip = document.getElementById('f_skipCold').checked;
  const b = {
    id, sourceGroup: val('f_sourceGroup'), breedDate: val('f_breedDate'),
    eggCollectedDate: val('f_eggCollectedDate'),
    coldRoomDate: skip ? 'SKIP' : val('f_coldRoomDate'),
    hotRoomDate: val('f_hotRoomDate'), tubDate: val('f_tubDate'),
    hatchedGroup: val('f_hatchedGroup'), redTrays: val('f_redTrays'), blackTrays: val('f_blackTrays')
  };
  upsertBatch(b);
  closeModal();
  toast('Batch saved');
}
function confirmDeleteBatch(id){
  if(confirm('Delete this batch? This cannot be undone.')){ deleteBatchById(id); closeModal(); toast('Batch deleted'); }
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* =========================================================================
   TABS & FAB
   ========================================================================= */
function switchTab(tab){
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tabpanel').forEach(p=>p.classList.toggle('active', p.id==='tab-'+tab));
  document.getElementById('fabBtn').style.display = (tab==='groups'||tab==='batches') ? 'flex' : 'none';
  renderAll();
}
document.querySelectorAll('.tab-btn').forEach(btn=>btn.addEventListener('click', ()=>switchTab(btn.dataset.tab)));
document.getElementById('fabBtn').addEventListener('click', ()=>{
  if(activeTab==='groups') openGroupModal(null);
  else if(activeTab==='batches') openBatchModal(null);
});
document.getElementById('groupSearch').addEventListener('input', renderGroups);
document.getElementById('batchSearch').addEventListener('input', renderBatches);

/* =========================================================================
   RENDER ALL / INIT
   ========================================================================= */
function renderAll(){
  renderDashboard();
  renderGroupFilters(); renderGroups();
  renderBatchFilters(); renderBatches();
  renderReports();
}
function init(){
  loadLocal();
  renderAll();
  switchTab('dashboard');
  syncFromServer(true);
  setInterval(()=>syncFromServer(true), CONFIG.POLL_MS);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncFromServer(true); });
  window.addEventListener('focus', ()=>syncFromServer(true));
  window.addEventListener('online', ()=>syncFromServer(true));
}
init();
</script>
</body>
</html>
